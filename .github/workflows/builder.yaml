name: Builder

env:
  MONITORED_FILES: "config.yaml Dockerfile rootfs"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          # Need full history so the PR diff base (origin/<base_ref>) resolves;
          # the default shallow clone has no origin/main ref and the diff below dies.
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          else
            changed=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || git ls-files)
          fi
          {
            echo "all<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Get changed add-ons
        id: changed_addons
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
        run: |
          changed_addons=()

          # A change to the build workflows themselves rebuilds every add-on, so a
          # pipeline edit is exercised by its own PR.
          if [[ "${CHANGED_FILES}" =~ \.github/workflows/(builder|build-addon)\.yaml ]]; then
            read -r -a changed_addons <<< "${ADDONS}"
          else
            for addon in ${ADDONS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${addon}/${file} ]]; then
                  changed_addons+=("${addon}")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_addons[@]} -gt 0 ]]; then
            echo "Changed add-ons: ${changed_addons[*]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "addons=$(jq -nc '$ARGS.positional' --args "${changed_addons[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "No add-on had any monitored files changed (${MONITORED_FILES})"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.addon }} add-on
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.changed_addons) }}
    uses: ./.github/workflows/build-addon.yaml
    with:
      addon: ${{ matrix.addon }}
      # PRs build both architectures without pushing; only a push to main publishes.
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
